name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "run full-model tests (downloads 2.3 GB)"
        type: boolean
        default: false
      quantize_variants:
        description: "bench: '|'-separated extra args for `bge-m3-lite quantize`, one build per entry"
        type: string
        default: ""
      fuse_local:
        description: "bench: also build the fused fp32 graph from the checked-out code and evaluate it"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bge-m3-lite
          key: bge-m3-small-files-v1
      - run: uv sync --group dev --group quant
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright && uv run pyproject-fmt --check pyproject.toml
      - run: uv run pytest -q
      - name: platform smoke
        run: uv run python -c "import platform, onnxruntime as ort; print(platform.machine(), ort.__version__, ort.get_available_providers())"

  slow:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.slow }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run bge-m3-lite --quiet download
      - run: BGE_M3_LITE_RUN_SLOW=1 uv run pytest -q -m slow

  bench:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev --group quant
      - run: uv run bge-m3-lite --quiet download
      - name: fetch the shipped int8 asset (may not exist yet before a release)
        run: uv run python -c "from bge_m3_lite import hub; hub.ensure_files((hub.INT8_FILE,), quiet=True)" || echo "::warning::int8 asset not available"
      - name: cpu model
        id: cpu
        shell: bash
        run: |
          cpu=$( { lscpu 2>/dev/null || true; } | sed -n 's/^Model name:[ \t]*//p' | head -1)
          [ -n "$cpu" ] || cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)
          [ -n "$cpu" ] || cpu=$(uv run python -c "import platform; print(platform.processor() or platform.machine())")
          ncpu=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "?")
          echo "cpu=$cpu ($ncpu vCPU)" >> "$GITHUB_OUTPUT"
          echo "$cpu"; { lscpu 2>/dev/null || true; } | grep -i flags | cut -c1-400 || true
      - shell: bash
        run: |
          cd ~/.cache/bge-m3-lite/BAAI--bge-m3
          files="model.onnx model_fused.onnx"; [ -f model_int8.onnx ] && files="$files model_int8.onnx"
          uv run --project "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/eval_model.py" $files | tee "$RUNNER_TEMP/eval.log"
      - name: fuse (local build)
        if: ${{ inputs.fuse_local }}
        shell: bash
        run: |
          cd ~/.cache/bge-m3-lite/BAAI--bge-m3
          # onnx's checker rejects hard links, ORT rejects symlinks that leave the model dir: copy
          mkdir -p local && cp model.onnx_data local/
          echo "##### fuse (local build)" | tee -a "$RUNNER_TEMP/eval.log"
          uv run --project "$GITHUB_WORKSPACE" bge-m3-lite --quiet fuse --output local
          uv run --project "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/eval_model.py" local/model_fused.onnx | tee -a "$RUNNER_TEMP/eval.log"
      - name: quantize variants
        if: ${{ inputs.quantize_variants != '' }}
        shell: bash
        run: |
          IFS='|' read -ra variants <<< "${{ inputs.quantize_variants }}"
          for v in "${variants[@]}"; do
            echo "##### quantize $v" | tee -a "$RUNNER_TEMP/eval.log"
            uv run bge-m3-lite --quiet quantize --output /tmp/variant.onnx $v
            uv run tools/eval_model.py /tmp/variant.onnx | tee -a "$RUNNER_TEMP/eval.log"
          done
      - name: summary table
        if: always()
        shell: bash
        run: uv run tools/bench_summary.py "$RUNNER_TEMP/eval.log" "${{ matrix.os }}" "${{ steps.cpu.outputs.cpu }}" >> "$GITHUB_STEP_SUMMARY"
