[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.8,<0.13" ]

[project]
name = "bge-m3-lite"
version = "0.0.2"
description = """\
  Lightweight CPU inference for BAAI/bge-m3 (dense + sparse + ColBERT) with onnxruntime as the only dependency.\
  """
readme = "README.md"
keywords = [ "bge-m3", "colbert", "embedding", "onnxruntime", "retrieval", "sparse" ]
license = "MIT"
authors = [ { name = "Allen Chou" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [ "onnxruntime>=1.17" ]
optional-dependencies.quant = [ "onnx>=1.16", "onnx-ir", "sympy" ]
urls.Homepage = "https://github.com/allen2c/bge-m3-lite"
scripts.bge-m3-lite = "bge_m3_lite.cli:main"

[dependency-groups]
dev = [ "pyproject-fmt>=2", "pyright>=1.1", "pytest>=8", "ruff>=0.6" ]
quant = [ "bge-m3-lite[quant]" ]
# Heavy reference stack, only used by tools/ to regenerate test fixtures.
ref = [ "flagembedding", "sentencepiece", "torch", "transformers" ]

[tool.uv]
build-backend.module-name = "bge_m3_lite"
build-backend.module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 88
format.quote-style = "double"
lint.select = [ "B", "E", "F", "I", "SIM", "UP", "W" ]
lint.per-file-ignores."tools/*" = [ "E501" ]
lint.isort.known-first-party = [ "bge_m3_lite" ]

[tool.pyright]
venv = ".venv"
venvPath = "."
typeCheckingMode = "standard"
include = [ "bge_m3_lite", "tests", "tools" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.markers = [ "slow: needs the full 2.3 GB model (skipped unless BGE_M3_LITE_RUN_SLOW=1)" ]
