name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "run full-model tests (downloads 2.3 GB)"
        type: boolean
        default: false
      quantize_variants:
        description: "bench: '|'-separated extra args for `bge-m3-lite quantize`, one build per entry"
        type: string
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bge-m3-lite
          key: bge-m3-small-files-v1
      - run: uv sync --group dev --group quant
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright && uv run pyproject-fmt --check pyproject.toml
      - run: uv run pytest -q
      - name: platform smoke
        run: uv run python -c "import platform, onnxruntime as ort; print(platform.machine(), ort.__version__, ort.get_available_providers())"

  slow:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.slow }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run bge-m3-lite --quiet download
      - run: BGE_M3_LITE_RUN_SLOW=1 uv run pytest -q -m slow

  bench:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev --group quant
      - run: uv run bge-m3-lite --quiet download
      - name: fetch the shipped int8 asset (may not exist yet before a release)
        run: uv run python -c "from bge_m3_lite import hub; hub.ensure_files((hub.INT8_FILE,), quiet=True)" || echo "::warning::int8 asset not available"
      - run: uv run python -c "import platform; print(platform.machine(), platform.processor())"; lscpu 2>/dev/null | grep -i -E "model name|flags" | cut -c1-400 || true
      - shell: bash
        run: |
          cd ~/.cache/bge-m3-lite/BAAI--bge-m3
          files="model.onnx model_fused.onnx"; [ -f model_int8.onnx ] && files="$files model_int8.onnx"
          uv run --project "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/eval_model.py" $files
      - name: quantize variants
        if: ${{ inputs.quantize_variants != '' }}
        shell: bash
        run: |
          IFS='|' read -ra variants <<< "${{ inputs.quantize_variants }}"
          for v in "${variants[@]}"; do
            echo "##### quantize $v"
            uv run bge-m3-lite --quiet quantize --output /tmp/variant.onnx $v
            uv run tools/eval_model.py /tmp/variant.onnx
          done
